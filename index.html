<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Jmix Demo Runbook</title>
<style>
  :root {
    --navy: #17124B; --yellow: #FDB42B; --pink: #FC1264; --pink-text: #FF6B9D; --green: #41B883; --cyan: #25CDE3;
    --ink: #DBDDE1; --white: #FFFFFF; --muted: #A3A6CC;
    --bg: #0B0925; --panel: #141039; --panel-2: #1C1750; --line: #2B2668; --line-hi: #4A4499; --code-bg: #0A081F;
    --sans: -apple-system, BlinkMacSystemFont, "Segoe UI Variable", "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    --mono: ui-monospace, "SF Mono", SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace;
    color-scheme: dark;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body { background: var(--bg); color: var(--ink); font-family: var(--sans); -webkit-font-smoothing: antialiased; }
  button { font: inherit; color: inherit; }
  :focus-visible { outline: 2px solid var(--white); outline-offset: 2px; }

  /* ================= СЦЕНА (окно для зала) ================= */
  body.view-stage { display: grid; place-items: center; background: #06051A; overflow: hidden; }
  body.view-stage .stage { width: min(100vw, 100vh * 16 / 9); }

  .stage {
    --s-title: var(--white); --s-text: var(--ink); --s-muted: var(--muted); --s-logo: var(--ink); --s-wm: #fff;
    --s-track: rgb(219 221 225 / .17); --s-done: rgb(219 221 225 / .55); --s-line: rgb(219 221 225 / .14);
    position: relative; container-type: inline-size; aspect-ratio: 16 / 9; width: 100%; overflow: hidden;
    color: var(--s-text); font-family: var(--sans);
    background:
      radial-gradient(60% 85% at 95% -5%, rgb(52 42 150 / .75) 0%, rgb(52 42 150 / 0) 70%),
      radial-gradient(55% 70% at -5% 105%, rgb(35 28 110 / .9) 0%, rgb(35 28 110 / 0) 70%),
      linear-gradient(165deg, #1B1556 0%, #17124B 45%, #0F0B36 100%);
  }
  /* светлая сцена для освещённого зала (T) */
  .stage.light {
    --s-title: var(--navy); --s-text: #26215E; --s-muted: #55528A; --s-logo: var(--navy); --s-wm: var(--navy);
    --s-track: rgb(23 18 75 / .12); --s-done: rgb(23 18 75 / .42); --s-line: rgb(23 18 75 / .12);
    background:
      radial-gradient(60% 85% at 95% -5%, rgb(201 197 245 / .55) 0%, rgb(201 197 245 / 0) 70%),
      linear-gradient(165deg, #FFFFFF 0%, #F5F6FA 55%, #ECEDF6 100%);
  }
  .st-wm { position: absolute; right: -15cqw; bottom: -17cqw; width: 34cqw; height: auto; opacity: .035;
    --lc1: var(--s-wm); --lc2: var(--s-wm); --lc3: var(--s-wm); --lc4: var(--s-wm); color: var(--s-wm); pointer-events: none; }
  .st-inner { position: absolute; inset: 3.1cqw 4.6cqw 4.6cqw; display: flex; flex-direction: column; }
  .st-top { display: flex; align-items: center; gap: 1.3cqw; min-height: 2.6cqw; font-size: 1.55cqw; color: var(--s-muted); }
  .st-count { font-weight: 500; letter-spacing: .03em; font-variant-numeric: tabular-nums; }
  .st-count b { color: var(--s-title); font-weight: 700; }
  .st-top i { width: .1cqw; height: 1.4cqw; background: var(--s-line); }
  .st-logo { margin-left: auto; height: 2.6cqw; width: auto; color: var(--s-logo); }
  .st-title { margin: 2.3cqw 0 0; font-size: 4.3cqw; line-height: 1.08; font-weight: 700; letter-spacing: -.018em;
    color: var(--s-title); text-wrap: balance; }
  .st-rule { flex: none; width: 4.6cqw; height: .32cqw; border-radius: 1cqw; background: var(--yellow); margin: 1.8cqw 0 2.1cqw; }
  .st-list { flex: 1; min-height: 0; overflow: hidden; margin: 0; padding: 0; list-style: none;
    font-size: var(--fs, 2.35cqw); line-height: 1.26; display: flex; flex-direction: column; gap: .45em; }
  .st-list li { position: relative; padding-left: 1.15em; text-wrap: balance; }
  .st-list li::before { content: ""; position: absolute; left: .1em; top: .46em; width: .34em; height: .34em;
    background: var(--yellow); border-radius: .05em; transform: rotate(45deg); }

  /* пре-флайт на сцене: заставка «скоро начнём», чек-лист живёт только в консоли */
  .hold .st-inner { inset: 4.4cqw 5.2cqw 6.2cqw; display: grid; grid-template-columns: 1fr 1.25fr; column-gap: 4.6cqw; align-items: center; }
  .h-logo { height: 4.6cqw; width: auto; color: var(--s-logo); display: block; }
  .h-kicker { margin: 5.2cqw 0 0; font-size: 1.6cqw; font-weight: 600; letter-spacing: .14em; text-transform: uppercase; color: var(--s-muted); }
  .h-title { margin: .9cqw 0 0; font-size: 6.2cqw; line-height: 1.02; font-weight: 750; letter-spacing: -.028em; color: var(--s-title); text-wrap: balance; }
  .h-when { margin: 0; font-size: 2.4cqw; color: var(--s-text); }
  .h-when b { color: var(--s-title); font-weight: 700; font-variant-numeric: tabular-nums; }
  .h-agenda { border-left: .1cqw solid var(--s-line); padding: .6cqw 0 .6cqw 4cqw; }
  .h-cap { margin: 0 0 1.7cqw; font-size: 1.6cqw; font-weight: 600; letter-spacing: .14em; text-transform: uppercase; color: var(--s-muted); }
  .h-list { list-style: none; margin: 0; padding: 0; display: grid; gap: 1.05cqw; font-size: 2.2cqw; line-height: 1.22; }
  .h-list li { display: grid; grid-template-columns: 2.1em 1fr; align-items: baseline; text-wrap: balance; }
  .h-list .n { font: 600 .82em/1 var(--mono); color: var(--s-muted); font-variant-numeric: tabular-nums; }

  .st-foot { position: absolute; left: 4.6cqw; right: 4.6cqw; bottom: 2.3cqw; }
  .st-strip { display: flex; gap: .35cqw; height: .7cqw; }
  .st-seg { position: relative; flex: var(--m) 1 0; min-width: 0; border-radius: 1cqw; overflow: hidden; background: var(--s-track); }
  .st-seg.done { background: var(--s-done); }
  .st-seg.cur::before { content: ""; position: absolute; inset: 0 auto 0 0; width: var(--p, 0%); background: var(--yellow); }
  .st-hint { position: absolute; right: 4.6cqw; bottom: 4cqw; font-size: 1.05cqw; color: var(--ink);
    background: rgb(10 8 31 / .86); border: 1px solid var(--line); border-radius: 2cqw; padding: .5cqw 1cqw;
    opacity: 0; transition: opacity .2s; pointer-events: none; }
  .st-hint kbd { font: 600 1em var(--mono); color: var(--yellow); background: none; border: 0; padding: 0; }
  body.view-stage .stage:hover .st-hint { opacity: 1; }

  /* ================= КОНСОЛЬ ДОКЛАДЧИКА ================= */
  .console { height: 100vh; display: grid; grid-template-rows: auto auto minmax(0, 1fr); gap: 10px; padding: 10px 14px 14px; }
  .panel { background: var(--panel); border: 1px solid var(--line); border-radius: 14px; min-width: 0; min-height: 0; }
  .cap { font-size: 14px; font-weight: 600; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); }
  .chip { display: inline-block; font: 600 14px/1 var(--mono); color: var(--ink); border: 1px solid var(--line-hi);
    border-radius: 6px; padding: 4px 6px; }
  .tag { display: inline-flex; align-items: center; gap: 4px; font-size: 14px; font-weight: 600; border-radius: 999px; padding: 2px 8px; }
  .tag.opt { color: var(--ink); background: rgb(219 221 225 / .1); }
  .tag.exit { color: var(--pink-text); background: rgb(252 18 100 / .14); }
  .tag svg { width: 13px; height: 13px; flex: none; }
  kbd { font: 600 14px/1 var(--mono); color: var(--ink); background: var(--panel-2); border: 1px solid var(--line);
    border-bottom-width: 2px; border-radius: 5px; padding: 3px 5px; }

  /* верхняя строка */
  .c-top { display: flex; flex-wrap: wrap; align-items: center; gap: 6px 12px; min-height: 40px; }
  .c-brand { display: flex; align-items: center; gap: 10px; }
  .c-brand svg { height: 26px; width: auto; color: var(--ink); }
  .c-brand .cap { border-left: 1px solid var(--line); padding-left: 10px; letter-spacing: .03em; white-space: nowrap; }
  .seg-ctl { display: flex; background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 3px; }
  .seg-ctl button { border: 0; background: transparent; border-radius: 7px; padding: 6px 10px; cursor: pointer;
    font-size: 14px; color: var(--muted); display: flex; align-items: center; gap: 6px; white-space: nowrap; }
  .seg-ctl button[aria-pressed="true"] { background: var(--panel-2); color: var(--white); box-shadow: inset 0 0 0 1px var(--line); }
  .seg-ctl button kbd { padding: 2px 4px; }
  .c-pill { display: inline-flex; align-items: center; gap: 7px; font-size: 14px; color: var(--ink); white-space: nowrap;
    border: 1px solid var(--line); border-radius: 999px; padding: 5px 10px 5px 8px; }
  .c-pill i { width: 7px; height: 7px; border-radius: 50%; background: var(--green); box-shadow: 0 0 0 3px rgb(65 184 131 / .2); }
  .c-pill span { color: var(--muted); }
  .c-keys { margin-left: auto; display: flex; align-items: center; gap: 8px; font-size: 14px; color: var(--muted); white-space: nowrap; }
  .c-keys span { display: inline-flex; align-items: center; gap: 3px; }
  .c-keys kbd { padding: 2px 4px; }
  .c-clock { font: 600 15px var(--sans); font-variant-numeric: tabular-nums; color: var(--ink);
    padding-left: 10px; border-left: 1px solid var(--line); }

  /* повестка: сегменты пропорциональны минутам */
  .agenda { padding: 9px 12px 10px; display: grid; gap: 7px; }
  .ag-head { display: flex; align-items: baseline; gap: 12px; }
  .ag-head .sum { font-size: 14px; color: var(--muted); }
  .ag-legend { margin-left: auto; display: flex; gap: 14px; font-size: 14px; color: var(--muted); }
  .ag-legend i { display: inline-block; width: 18px; height: 10px; border-radius: 3px; vertical-align: -1px; margin-right: 5px; }
  .ag-legend .l-opt { background: repeating-linear-gradient(-45deg, rgb(219 221 225 / .35) 0 3px, transparent 3px 6px); border: 1px solid var(--line); }
  .ag-legend .l-exit { width: 4px; background: var(--pink); }
  .ag-legend .l-cur { background: var(--yellow); }
  .ag-track { display: flex; gap: 4px; }
  .ag-seg { position: relative; container-type: inline-size; flex: var(--m) 1 0; min-width: 0; height: 54px; text-align: left;
    border: 1px solid var(--line); border-radius: 8px; background: var(--panel-2); padding: 6px 8px; cursor: pointer; overflow: hidden; }
  .ag-seg.pre { flex: 0 0 70px; }
  .ag-seg:hover { border-color: var(--line-hi); }
  .ag-seg.opt { background-image: repeating-linear-gradient(-45deg, rgb(219 221 225 / .07) 0 5px, transparent 5px 10px); }
  .ag-seg.exit::after { content: ""; position: absolute; top: 0; right: 0; bottom: 0; width: 4px; background: var(--pink); }
  .ag-seg.done { background-color: transparent; }
  .ag-seg.cur { border-color: var(--yellow); background: rgb(253 180 43 / .1); }
  .ag-seg.cur .now { position: absolute; left: 0; bottom: 0; height: 3px; width: var(--p); background: var(--yellow); }
  .ag-l1 { display: flex; align-items: center; gap: 6px; font-size: 14px; white-space: nowrap; }
  .ag-l1 b { font-family: var(--mono); font-weight: 700; color: var(--white); }
  .ag-l1 .m { color: var(--muted); font-variant-numeric: tabular-nums; }
  .ag-l1 .ok { color: var(--green); }
  .ag-l2 { margin-top: 3px; font-size: 14px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .ag-seg.cur .ag-l2 { color: var(--ink); }
  .ag-l2 .over { color: var(--pink-text); } .ag-l2 .under { color: var(--green); }
  @container (width < 100px) { .ag-l2.title { visibility: hidden; } .ag-l2 .f-lbl { display: none; } }
  @container (width < 60px) { .ag-l1 .m { display: none; } }

  /* основная сетка: шаги — самая нужная колонка, ей больше места */
  .c-main { display: grid; grid-template-columns: 300px minmax(0, .85fr) minmax(0, 1.3fr); gap: 10px; min-height: 0; }
  .c-left { display: flex; flex-direction: column; gap: 10px; min-height: 0; }

  .timer { padding: 12px 14px 13px; }
  .t-row { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
  .t-live { display: inline-flex; align-items: center; gap: 6px; font-size: 14px; color: var(--green); font-weight: 600; white-space: nowrap; }
  .t-live::before { content: ""; width: 7px; height: 7px; border-radius: 50%; background: var(--green); box-shadow: 0 0 0 3px rgb(65 184 131 / .2); }
  .t-big { display: flex; align-items: baseline; gap: 8px; margin-top: 2px; }
  .t-big strong { font-size: 54px; line-height: 1.05; font-weight: 650; letter-spacing: -.02em; color: var(--white); font-variant-numeric: tabular-nums; }
  .t-big strong.late { color: var(--pink-text); }
  .t-big span { font-size: 15px; color: var(--muted); font-variant-numeric: tabular-nums; }
  .t-bar { height: 6px; border-radius: 6px; background: var(--panel-2); overflow: hidden; margin: 8px 0 10px; }
  .t-bar i { display: block; height: 100%; width: var(--p); background: var(--yellow); border-radius: 6px; }
  .t-stats { display: grid; grid-template-columns: repeat(3, auto); justify-content: space-between; margin: 0; }
  .t-stats dt { font-size: 14px; color: var(--muted); letter-spacing: .04em; text-transform: uppercase; }
  .t-stats dd { margin: 2px 0 0; font-size: 15px; font-weight: 600; color: var(--ink); font-variant-numeric: tabular-nums; }
  .t-stats dd.late { color: var(--pink-text); }
  .t-idle { font-size: 14px; color: var(--muted); margin: 0; line-height: 1.4; }
  .t-bar.ok i { background: var(--green); }
  .t-live.wait { color: var(--muted); } .t-live.wait::before { background: var(--muted); box-shadow: none; }
  .t-exit { margin: 11px 0 0; display: flex; align-items: center; gap: 8px; font-size: 14px; line-height: 1.3; padding: 7px 8px 7px 9px;
    border-radius: 8px; background: rgb(219 221 225 / .06); color: var(--muted); }
  .t-exit.late { background: rgb(252 18 100 / .12); color: var(--pink-text); box-shadow: inset 0 0 0 1px rgb(252 18 100 / .4); }
  .t-exit svg { width: 14px; height: 14px; flex: none; }
  .t-exit span { flex: 1; min-width: 0; }
  .t-exit b { font-weight: 700; font-variant-numeric: tabular-nums; }

  .now-shot { padding: 10px 12px 12px; }
  .now-shot .t-row { margin-bottom: 8px; }
  .now-shot .stage { border-radius: 8px; box-shadow: 0 0 0 1px var(--line), 0 8px 24px rgb(0 0 0 / .35); }
  .now-shot .st-hint { display: none; }
  .ns-title { display: none; }
  /* невысокий экран ноутбука: миниатюра ужимается в полосу, место уходит карточке «Далее» */
  @media (max-height: 799px) {
    .now-shot { display: grid; grid-template-columns: 112px minmax(0, 1fr); column-gap: 12px; align-items: center; padding: 9px 10px; }
    .now-shot .stage { grid-row: 1 / span 2; border-radius: 6px; }
    .now-shot .t-row { flex-direction: column; align-items: flex-start; gap: 3px; margin: 0; align-self: end; }
    .ns-title { display: -webkit-box; -webkit-box-orient: vertical; -webkit-line-clamp: 2; overflow: hidden; align-self: start; margin-top: 4px;
      font-size: 14px; line-height: 1.3; font-weight: 600; color: var(--white); }
  }

  .next { padding: 11px 13px 12px; flex: 1; min-height: 0; overflow: hidden; display: flex; flex-direction: column; gap: 7px; }
  .nx-head { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; font-size: 14px; color: var(--muted); }
  .nx-title { font-size: 16.5px; font-weight: 650; color: var(--white); line-height: 1.25; text-wrap: balance; }
  .nx-steps { list-style: none; margin: 3px 0 0; padding: 9px 0 0; border-top: 1px solid var(--line); display: grid; gap: 8px; }
  .nx-step { display: grid; grid-template-columns: 22px minmax(0, 1fr) auto; gap: 9px; align-items: start; }
  .nx-step .s-ic { width: 22px; height: 22px; border-radius: 6px; }
  .nx-step .s-ic svg { width: 13px; height: 13px; }
  .nx-txt { display: -webkit-box; -webkit-box-orient: vertical; -webkit-line-clamp: 2; overflow: hidden; padding-top: 2px;
    font-size: 14px; line-height: 1.38; color: var(--ink); overflow-wrap: anywhere; }
  .nx-txt.mono { font-family: var(--mono); font-size: 14px; line-height: 1.5; }
  .k-url .nx-txt { color: var(--cyan); }
  .nx-step .copy { width: 26px; height: 24px; margin: 0; }
  @media (max-height: 899px) { .nx-step:nth-child(n+3) { display: none; } }

  /* колонки с заголовком и прокруткой */
  .col { display: flex; flex-direction: column; }
  .col-head { display: flex; align-items: center; gap: 10px; padding: 9px 12px 9px 14px; min-height: 46px; border-bottom: 1px solid var(--line); }
  .col-head h2 { margin: 0; font-size: 14px; font-weight: 650; color: var(--white); white-space: nowrap; }
  .col-head .count { font-size: 14px; color: var(--muted); font-variant-numeric: tabular-nums; white-space: nowrap; min-width: 0; overflow: hidden; text-overflow: ellipsis; }
  .col-head .count b { color: var(--white); font-weight: 650; }
  .col-head .hint { font-size: 14px; color: var(--muted); display: inline-flex; align-items: center; gap: 3px; white-space: nowrap; }
  .col-head .hint kbd { padding: 2px 4px; }
  .col-head .spacer { flex: 1; }
  .ghost { border: 1px solid var(--line); background: transparent; border-radius: 7px; padding: 4px 9px; font-size: 14px;
    color: var(--muted); cursor: pointer; white-space: nowrap; }
  .ghost:hover { color: var(--white); border-color: var(--line-hi); }
  .col-body { position: relative; flex: 1; min-height: 0; overflow-y: auto; scrollbar-width: thin; scrollbar-color: var(--line) transparent;
    -webkit-mask-image: linear-gradient(#000 calc(100% - 28px), transparent); mask-image: linear-gradient(#000 calc(100% - 28px), transparent); }

  /* заметки: короткий жирный лид, остальное приглушено и раскрывается */
  .notes { padding: 4px 14px 28px; }
  .note { border-bottom: 1px solid rgb(43 38 104 / .7); }
  .note:last-child { border-bottom: 0; }
  .note summary { list-style: none; cursor: pointer; display: grid; grid-template-columns: 20px 1fr 14px; gap: 6px; padding: 10px 0;
    font-size: 15px; line-height: 1.5; }
  .note summary::-webkit-details-marker { display: none; }
  .note .n-i { font: 600 14px/1 var(--mono); color: var(--muted); padding-top: 5px; }
  .note .n-text { min-width: 0; text-wrap: pretty; }
  .note .n-lead { font-weight: 650; color: var(--white); }
  .note .n-lead.soft { font-weight: 400; color: var(--ink); } /* лид не влез в строку — без жирного, но ярче остального */
  .note .n-rest { color: var(--muted); }
  .note[open] .n-rest { color: var(--ink); }
  .note:not([open]) .n-text { display: -webkit-box; -webkit-box-orient: vertical; -webkit-line-clamp: 2; overflow: hidden; }
  @media (min-height: 900px) { .note:not([open]) .n-text { -webkit-line-clamp: 4; } }
  .note .chev { width: 14px; height: 14px; margin-top: 5px; color: var(--muted); transition: rotate .2s; }
  .note[open] .chev { rotate: 90deg; }
  .note summary:hover .n-text { color: var(--white); }
  @media (prefers-reduced-motion: reduce) { .note .chev { transition: none; } }

  /* действия: нумерованные шаги с активным */
  .steps { list-style: none; margin: 0; padding: 6px 8px 28px; }
  .step { display: grid; grid-template-columns: 22px 26px minmax(0, 1fr) auto; gap: 8px; align-items: start; padding: 6px 6px 6px 8px;
    border-bottom: 1px solid rgb(43 38 104 / .55); border-radius: 8px; cursor: pointer; }
  .step:last-child { border-bottom-color: transparent; }
  .step:hover { background: rgb(28 23 80 / .55); }
  .step.done { opacity: .6; }
  .step.active { opacity: 1; background: var(--panel-2); border-bottom-color: transparent; box-shadow: inset 3px 0 0 var(--yellow); }
  .step.active .s-n { color: var(--white); }
  .steps.short-on .step.full-only:not(.active) { opacity: .28; }
  .step .s-n { font: 600 14px/26px var(--mono); color: var(--muted); text-align: right; font-variant-numeric: tabular-nums; }
  .s-ic { width: 26px; height: 26px; border-radius: 7px; display: grid; place-items: center; background: rgb(var(--k) / .14); color: rgb(var(--k)); }
  .s-ic svg { width: 15px; height: 15px; }
  .step .s-body { min-width: 0; padding-top: 3px; font-size: 14px; line-height: 1.45; }
  .k-shell { --k: 65 184 131; } .k-git { --k: 138 184 255; } .k-url { --k: 37 205 227; } .k-studio { --k: 180 182 214; }
  .k-say { --k: 219 221 225; } .k-prompt { --k: 196 181 253; }
  .step:is(.k-shell, .k-git, .k-prompt) .s-body { padding-top: 0; }
  .s-code { display: block; font-family: var(--mono); font-size: 14px; line-height: 1.5; color: var(--ink); background: var(--code-bg);
    border: 1px solid var(--line); border-radius: 7px; padding: 3px 9px; white-space: pre-wrap; overflow-wrap: anywhere; }
  .s-code::before { content: "$ "; color: rgb(var(--k)); }
  .s-url { font-family: var(--mono); font-size: 14px; color: var(--cyan); text-decoration: none; overflow-wrap: anywhere; }
  .s-url:hover { text-decoration: underline; }
  .s-arr { color: var(--muted); }
  .k-say .s-text { font-size: 15px; font-weight: 600; color: var(--white); }
  .k-say .s-text::before { content: "«"; color: var(--muted); } .k-say .s-text::after { content: "»"; color: var(--muted); }
  .s-prompt { display: block; border-left: 2px solid rgb(var(--k) / .6); background: rgb(28 23 80 / .7); border-radius: 0 7px 7px 0;
    padding: 3px 10px; color: var(--ink); font-size: 14px; overflow-wrap: anywhere; }
  .b8 { display: inline-block; font: 700 14px/1 var(--mono); color: var(--navy); background: var(--yellow); border-radius: 4px;
    padding: 3px 5px; margin-right: 6px; vertical-align: 1px; }
  .copy { height: 28px; min-width: 30px; margin-top: -1px; display: flex; align-items: center; justify-content: center; gap: 5px; padding: 0 7px;
    border-radius: 7px; cursor: pointer; border: 1px solid var(--line); background: var(--panel-2); color: var(--muted); }
  .copy:hover { color: var(--white); border-color: var(--line-hi); }
  .copy svg { width: 14px; height: 14px; flex: none; }
  .copy .ck { display: none; padding: 1px 4px; font-size: 14px; }
  .step.active .copy { color: var(--white); border-color: var(--line-hi); background: var(--bg); }
  .step.active .copy .ck { display: inline-block; }
  .copy.ok { color: var(--green); border-color: var(--green); }
  .tgl { display: inline-flex; align-items: center; gap: 2px; border: 1px solid var(--line); background: transparent; border-radius: 8px;
    padding: 3px 4px 3px 4px; font-size: 14px; color: var(--muted); cursor: pointer; white-space: nowrap; }
  .tgl .b8 { margin-right: 4px; }
  .tgl kbd { margin-left: 6px; padding: 2px 4px; }
  .tgl:hover { color: var(--white); border-color: var(--line-hi); }
  .tgl[aria-pressed="true"] { color: var(--white); border-color: rgb(253 180 43 / .6); background: rgb(253 180 43 / .1); }

  /* пре-флайт в консоли: чек-лист над заметками */
  .pf-list { list-style: none; margin: 0; padding: 8px 14px 4px; display: grid; gap: 2px; border-bottom: 1px solid var(--line); }
  .pf-list label { display: grid; grid-template-columns: 18px 1fr; gap: 10px; padding: 6px 0; font-size: 14px; line-height: 1.4; cursor: pointer; }
  .pf-list input { appearance: none; width: 18px; height: 18px; margin: 1px 0 0; border-radius: 5px; border: 1.5px solid var(--muted); display: grid; place-items: center; cursor: pointer; }
  .pf-list input:checked { background: var(--green); border-color: var(--green); }
  .pf-list input:checked::after { content: ""; width: 4px; height: 8px; border: solid var(--navy); border-width: 0 2px 2px 0; transform: translateY(-1px) rotate(45deg); }
  .pf-list input:checked + span { color: var(--muted); }

  #status { position: fixed; left: 50%; bottom: 18px; translate: -50% 0; background: var(--panel-2); border: 1px solid var(--line);
    color: var(--ink); border-radius: 10px; padding: 8px 14px; font-size: 14px; opacity: 0; transition: opacity .2s; pointer-events: none; }
  #status.on { opacity: 1; }

  @media (min-width: 1600px) {
    .c-main { grid-template-columns: 420px minmax(0, .85fr) minmax(0, 1.3fr); }
    .note summary { font-size: 16px; } .step .s-body { font-size: 15px; } .s-code { font-size: 14px; }
    .nx-txt { font-size: 14px; } .nx-txt.mono { font-size: 14px; }
  }
  @media (max-width: 1000px) {
    .console { height: auto; } .c-main { grid-template-columns: 1fr; } .c-keys, .c-pill { display: none; }
    .col-body { max-height: 70vh; } .ag-track { flex-wrap: wrap; } .ag-seg { flex-basis: 90px; }
  }

  /* ================= ПАНЕЛЬ ДЛЯ ЗЕРКАЛА (клавиша N на сцене) ================= */
  /* Сцена ужимается, остаётся 16:9 и встаёт по центру верхней строки; панель — нижняя строка высотой --dock-h. */
  body.view-stage.dock-open { --dock-h: clamp(120px, 19vh, 190px); grid-template-rows: minmax(0, 1fr) auto; }
  body.view-stage.dock-open #app { display: contents; }
  body.view-stage.dock-open .stage { width: min(100vw, (100vh - var(--dock-h)) * 16 / 9); }
  body.dock-open #status { bottom: calc(var(--dock-h) + 12px); }
  .dock { align-self: stretch; justify-self: stretch; height: var(--dock-h); min-width: 0; overflow: hidden;
    display: grid; grid-template-columns: auto minmax(0, 1fr) minmax(0, .8fr) auto; align-items: center; gap: 24px; padding: 12px 24px;
    background: var(--panel); border-top: 1px solid var(--line); color: var(--ink); font-size: 20px; }
  .dock .cap { font-size: 18px; }
  .dock kbd { font: 600 18px/1 var(--mono); padding: 4px 7px; }
  .d-time { min-width: 150px; }
  .d-time strong { display: block; font-size: 38px; line-height: 1.05; font-weight: 650; letter-spacing: -.02em; color: var(--white); font-variant-numeric: tabular-nums; }
  .d-time strong.late { color: var(--pink-text); }
  .d-time span { display: block; font-size: 18px; color: var(--muted); white-space: nowrap; }
  .d-bar { height: 6px; border-radius: 6px; background: var(--panel-2); overflow: hidden; margin-top: 8px; }
  .d-bar i { display: block; height: 100%; width: var(--p, 0%); background: var(--yellow); border-radius: 6px; }
  .d-step { display: grid; grid-template-columns: auto auto minmax(0, 1fr) auto; align-items: center; gap: 12px; min-width: 0; }
  .dock .s-n { font: 600 18px var(--mono); color: var(--muted); font-variant-numeric: tabular-nums; white-space: nowrap; }
  .dock .s-ic { width: 34px; height: 34px; border-radius: 9px; }
  .dock .s-ic svg { width: 20px; height: 20px; }
  .d-txt { display: -webkit-box; -webkit-box-orient: vertical; -webkit-line-clamp: 2; overflow: hidden; min-width: 0;
    font-size: 21px; line-height: 1.3; color: var(--white); overflow-wrap: anywhere; }
  .d-txt.mono { font-family: var(--mono); font-size: 20px; line-height: 1.35; }
  .d-txt.url { color: var(--cyan); }
  .d-next { display: grid; gap: 4px; min-width: 0; }
  .d-next .d-txt { font-size: 20px; color: var(--ink); }
  .d-next .d-txt.mono { font-size: 18px; }
  .dock .copy { height: 40px; min-width: 44px; margin: 0; gap: 8px; padding: 0 10px; border-radius: 9px; color: var(--white); border-color: var(--line-hi); background: var(--bg); }
  .dock .copy svg { width: 20px; height: 20px; }
  .dock .copy .ck { display: inline-block; padding: 4px 7px; font-size: 18px; }
  .d-keys { display: grid; gap: 8px; justify-items: start; font-size: 18px; line-height: 1.3; color: var(--muted); white-space: nowrap; }
  .d-keys kbd + kbd { margin-left: 4px; }
  .d-keys kbd:last-child { margin-right: 6px; }
</style>
</head>
